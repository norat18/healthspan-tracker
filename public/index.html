<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healthspan Tracker</title>
<meta name="description" content="Free, private tracker for blood tests, body composition, fitness, scans, screenings and vaccines — with reminders when each is due.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">♥</span>
    <div><h1>Healthspan Tracker</h1><p class="sub">Your health, all in one place</p></div>
    <span id="sync" class="acct-area" role="status"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button data-view="summary" class="active">Summary</button>
    <button data-view="reminders">Reminders</button>
    <button data-view="blood">Bloodwork</button>
    <button data-view="body">Body &amp; Fitness</button>
    <button data-view="procs">Imaging &amp; Checkups</button>
    <button data-view="myinfo">My Info</button>
    <button data-view="data">Data</button>
  </nav>
</header>
<main id="view"></main>
<dialog id="modal"><div id="modal-body"></div></dialog>
<div id="toast" role="status"></div>
<script src="catalog.js?v=2"></script>
<script src="scans.js?v=2"></script>
<script src="summary.js?v=2"></script>
<script src="results.js?v=2"></script>
<script src="pastdates.js?v=2"></script>
<script src="myinfo.js?v=2"></script>
<script src="visit.js?v=2"></script>
<script src="labimport.js?v=2"></script>
<script src="app.js?v=2"></script>
<script type="module" src="cloud.js?v=2"></script>
</body>
</html>
